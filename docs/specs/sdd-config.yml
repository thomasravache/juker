# Configuração SDD do Juker — lida pelos agentes (comandos dos gates) e por spec_graph.py.
# Comandos rodam na raiz do repositório. Enquanto a fundação (SPEC-0001) não for implementada,
# os comandos ficam "" e os gates correspondentes são N/A apontando a spec que os cria.

base_branch: main
max_parallel: 3

# --- Build e testes (G2, G5) --- criados por SPEC-0002 / SPEC-0003
build: "dotnet build Juker.slnx -c Release -warnaserror"
test: "dotnet test --solution Juker.slnx -c Release"   # Microsoft.Testing.Platform (xUnit v3): --solution/--project
test_integration: "dotnet test --solution Juker.slnx -c Release --filter-trait \"Category=Integration\""   # SPEC-0003
test_e2e: "dotnet test --project tests/Juker.E2ETests -c Release"   # SPEC-0025
smoke_test: "dotnet test --project tests/Juker.E2ETests -c Release --filter-trait \"Category=Smoke\""   # SPEC-0025 (com JUKER_E2E_BASE_URL roda contra o ambiente)
lint: "dotnet format Juker.slnx --verify-no-changes"
coverage: ""              # SPEC-0005 — alvo: "reportgenerator … && diff-cover coverage.cobertura.xml --compare-branch=origin/main --fail-under=80"
coverage_min_changed_lines: 80
mutation: ""              # SPEC-0005 — alvo: "dotnet stryker -f tests/Juker.Modules.Queue.UnitTests/stryker-config.json" (não bloqueante)

# --- Arquitetura e segurança (G3, G5) --- criados por SPEC-0003 / SPEC-0004
arch_test: "dotnet test --project tests/Juker.ArchitectureTests -c Release"   # SPEC-0003
security_scan: ""         # alvo: "dotnet list package --vulnerable --include-transitive && gitleaks detect"

# --- CI/CD e ambientes (G5, G6) --- criados por SPEC-0004 / SPEC-0005
ci: ""                    # alvo: "gh pr checks --watch"
deploy_staging: ""        # alvo: "merge em main → workflow deploy (staging)"
deploy_production: ""     # alvo: "gh workflow run deploy.yml -f env=production (com aprovação do environment)"
staging_url: ""           # domínio a definir (pré-requisito externo de SPEC-0005)
production_url: ""

# --- Worktrees ---
# Dentro do repositório por decisão do fundador; a pasta está no .gitignore (não há .dockerignore).
worktree_dir: ".worktrees"
worktree_allow: []

# --- Rastreabilidade e escopo (G1, G4) ---
test_paths:
  - "tests/**"
  - "**/*.Tests/**"
  - "**/*Tests/**"
scope_exempt:
  - "docs/specs/**"
  - "docs/adr/**"
  - "AGENTS.md"          # doc raiz atualizada no G7 de qualquer spec (root_docs)
  - "README.md"          # idem
  - "CLAUDE.md"          # idem
  - "tools/sdd/**"       # cópia vendorizada da skill, atualizada por `vendor` ([no-spec])
  - ".gitignore"         # mudanças sem comportamento ([no-spec]); revisadas no PR
dependency_manifests:
  - "Directory.Packages.props"
  - "Directory.Build.props"
  - "**/*.csproj"
  - "global.json"
  - ".config/dotnet-tools.json"

# --- Board / tracker ---
tracker:
  provider: none
  project: ""
  mode: push
  labels:
    - sdd
  blocked_label: sdd-bloqueado
  statuses:
    proposed: ""
    approved: ""
    in-progress: ""
    implemented: ""
    deprecated: ""
  issue_types:
    epic: ""
    feature: ""
    fix: ""
    refactor: ""
    migration: ""
    foundation: ""

# --- Jornadas críticas (references/testing.md da skill) ---
# Definidas a partir da SPEC-0025 (harness de E2E); cada uma precisará de um E2E marcado [jornada: <id>].
critical_journeys: {}

# --- Pilares de entrega --- decisão do fundador em 2026-10-13
pillars:
  profile: padrao
  waived: {}
  extra: {}

# --- Fluxo de mudança --- decisão do fundador em 2026-10-13: toda onda entra na main por PR
# da branch de integração (sdd/SPEC-0001), com merge commit. O histórico anterior (merges locais) fica como está.
change_flow: pr
change_flow_reason: ""

# --- Aprovações humanas --- H1 sempre no chat. H2: thomas autorizou no chat (2026-10-13) push, PRs e merge
# quando o CI configurado passar por inteiro. Deploy em produção nunca é coberto: confirmação por release.
h1_policy: chat
h2_policy: auto-on-green
h2_policy_approved_by: thomas
h2_policy_approved_at: 2026-10-13

# --- Pull requests ---
pr_title: "{conv}: {title} [{id}]"
pr_title_policy: fail
pr_title_max: 100

# --- Documentação (G7) ---
root_docs:
  - CLAUDE.md
  - README.md
changelog: CHANGELOG.md
dod_extra:
  - "Textos da interface em português do Brasil, sem conceitos fora do produto (contas, créditos, mesa, música ao vivo)"
  - "Tokens visuais vindos do design system do Stitch (projeto 8904741919458823023), sem cores/fontes avulsas"
